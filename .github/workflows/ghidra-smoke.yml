name: Cloud Ghidra fallback smoke (synthetic data only)
on:
  push:
    paths:
      - '.devcontainer/**'
      - 'tools/**'
      - 'tests/**'
      - '.github/workflows/ghidra-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cloud-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Build the same container used by Codespaces
        run: docker build --file .devcontainer/Dockerfile --tag dotm-phase1-smoke .
      - name: Verify pinned downloads and headless PPC metadata pipeline
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/dotm-smoke-home -e GITHUB_ACTIONS=true \
            -v "$PWD:/workspaces/dotm" -w /workspaces/dotm dotm-phase1-smoke \
            bash -c 'set -euo pipefail; mkdir -p "$HOME"; python --version; java -version; python tools/check_repository.py; python -m unittest discover -s tests -v; bash tools/bootstrap_ghidra.sh; python tools/smoke_ghidra.py'
      # Deliberately no artifact upload and no source URL/secret inputs.
